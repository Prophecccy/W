name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Git release tag (e.g. Beta.v.1.1) — the semver for the updater comes from tauri.conf.json, not this tag'
        required: true
        default: 'Beta.v.1.1'
      changelog:
        description: 'Release changelog / description'
        required: true
        default: |
          W — Beta v1.1 Release

          - Hardened Desktop, Web/Mobile, BFF API, and CI/Release pipelines across OWASP Top 10 & API Top 10 controls.
          - Per-window least-privilege Tauri v2 capabilities, DPAPI vault with TLS 1.2+ zero-redirect token exchange, and rotating security audit logging.
          - Rotated Tauri updater signing key and hardened Google OAuth PKCE + BFF HttpOnly cookie session flow.

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Rust Stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Dependencies
        run: npm ci

      - name: Security & Integrity Verification Gate
        run: npx tsc --noEmit && npm run typecheck:api && npm test

      - name: Debug Signing Key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "ERROR: TAURI_SIGNING_PRIVATE_KEY is empty!"
            exit 1
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is set (length: ${#TAURI_SIGNING_PRIVATE_KEY})"
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "WARNING: TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty (key may be unencrypted)"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set"
          fi
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          TAURI_GOOGLE_CLIENT_SECRET: ${{ secrets.TAURI_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.event.inputs.version }}
          releaseName: "W Desktop ${{ github.event.inputs.version }}"
          releaseBody: ${{ github.event.inputs.changelog }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
