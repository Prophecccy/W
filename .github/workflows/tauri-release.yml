name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Git release tag (e.g. Alpha.v.1.7.1) — the semver for the updater comes from tauri.conf.json, not this tag'
        required: true
        default: 'Alpha.v.1.7.1'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Rust Stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Dependencies
        run: npm ci

      - name: Debug Signing Key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "ERROR: TAURI_SIGNING_PRIVATE_KEY is empty!"
            exit 1
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is set (length: ${#TAURI_SIGNING_PRIVATE_KEY})"
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "WARNING: TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty (key may be unencrypted)"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set"
          fi
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.event.inputs.version }}
          releaseName: "W Desktop ${{ github.event.inputs.version }}"
          releaseBody: |
            Evolution Protocol — Version 1.7.1

            ### 🚀 Redesigns & Features
            - **Custom Retro DatePicker**: Integrated a custom, responsive retro DatePicker component for todo deadlines and habit start/end dates, with quick presets (Today, Tomorrow, +3 Days, +1 Week) and clean keyboard navigation.
            - **Console-Style Todo Creator**: Streamlined the creator panel to a clean, centered layout with horizontal category tag styling.
            - **Desktop Widget Creation Launch Trigger**: Added a fast `[ + TODO ]` trigger inside the desktop widget that automatically opens the creation modal.

            ### 🛡️ Critical Bug Fixes & UX Optimization (Batch 1)
            - **Numbered Todo Fixes**: Resolved double-increment and auto-completion timing desynchronizations.
            - **Timezone-Aware Deadlines**: Patched the deadline checker to respect custom timezone offsets and user-specific rollover times.
            - **Cold Boot Stability**: Handled auth initialization delays to prevent uncaught exceptions on launch.
            - **Memory & Resource Leak Cleanup**: Cleared inactive Tauri listeners and toast timers to prevent thread/battery leaks.
            - **Strike System Safety**: Re-ordered Firestore writes to prevent duplicate strikes under slow networks, and disabled strikes during active freeze intervals.

            ### ⚡ Batch 2 Performance & UI Patches
            - **Custom Deadline Validation**: Disabled Enter-key bypass submissions on empty custom dates.
            - **Reps Count Locking**: Refactored the repetitions field to a non-locking text input, clamping values only on submission.
            - **Group category Reference Safety**: Prevented empty new groups from creating garbage database links.
            - **Auto-Purging (Firestore Optimization)**: Cap completed todo lists strictly to the 50 most recent documents via automatic database purging.
            - **Command Palette Efficiency**: Scoped search listeners to active items only, avoiding full history downloads.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
