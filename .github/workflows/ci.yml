name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript Check (App + API)
        run: npx tsc --noEmit && npm run typecheck:api

      - name: Unit & Security Tests
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Bundle Secret Scan
        run: |
          if grep -rnE "GOCSPX-|VITE_GOOGLE_CLIENT_SECRET|BEGIN PRIVATE KEY" dist/assets/; then
            echo "ERROR: Secret detected in production bundle!"
            exit 1
          fi
